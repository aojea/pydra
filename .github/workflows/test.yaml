name: Integration Tests

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt --index-url https://pypi.org/simple
          .venv/bin/pip install pytest --index-url https://pypi.org/simple

      - name: Install latest kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Compile Protobufs
        run: |
          make protos

      - name: Run verification checks
        run: |
          make verify

      - name: Run Integration Tests
        run: |
          make test-integration

  publish:
    name: Publish Images
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    timeout-minutes: 100
    env:
      REGISTRY: ghcr.io
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for AMD
      id: meta-amd
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/amd
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push AMD image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: kubernetes/amd/Dockerfile
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-amd.outputs.tags }}
        labels: ${{ steps.meta-amd.outputs.labels }}

    - name: Extract metadata for Network
      id: meta-network
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/network
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push Network image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: kubernetes/network/Dockerfile
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-network.outputs.tags }}
        labels: ${{ steps.meta-network.outputs.labels }}

    - name: Extract metadata for Nvidia
      id: meta-nvidia
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/nvidia
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push Nvidia image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: kubernetes/nvidia/Dockerfile
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-nvidia.outputs.tags }}
        labels: ${{ steps.meta-nvidia.outputs.labels }}

    - name: Extract metadata for TPU
      id: meta-tpu
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/tpu
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push TPU image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: kubernetes/tpu/Dockerfile
        platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: true
        tags: ${{ steps.meta-tpu.outputs.tags }}
        labels: ${{ steps.meta-tpu.outputs.labels }}
