apiVersion: resource.k8s.io/v1
kind:  ResourceClaim
metadata:
  name: dummy-interface-restart-test
spec:
  devices:
    requests:
    - name: req-dummy
      exactly:
        deviceClassName: dra.net
        selectors:
          - cel:
              expression: has(device.attributes["dra.net"].name) && device.attributes["dra.net"].name == "dummy1"
    config:
    - opaque:
        driver: dra.net
        parameters:
          interface:
            name: "eth99"
            addresses:
            - "169.254.169.14/24"
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-network-restart-test
  labels:
    app: pod
spec:
  containers:
  - name: ctr1
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    command: ["/agnhost", "pause"]
    resources:
      claims:
      - name: dummy2
  resourceClaims:
  - name: dummy2
    resourceClaimName: dummy-interface-restart-test
