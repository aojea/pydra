apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pydra-network-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: pydra-network-plugin
  template:
    metadata:
      labels:
        app: pydra-network-plugin
    spec:
      serviceAccountName: pydra-plugin
      tolerations:
      - operator: Exists
      containers:
      - name: driver
        image: pydra/network:test
        imagePullPolicy: Never
        command: ["python", "-m", "pydra.plugins.network.driver"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SOCKET_PATH
          value: /var/lib/kubelet/plugins/dra.net/plugin.sock
        - name: REGISTRATION_SOCKET_PATH
          value: /var/lib/kubelet/plugins_registry/dra.net-reg.sock
        - name: CDI_DIR
          value: /var/run/cdi
        securityContext:
          privileged: true
        volumeMounts:
        - name: plugins
          mountPath: /var/lib/kubelet/plugins
        - name: plugins-registry
          mountPath: /var/lib/kubelet/plugins_registry
        - name: cdi
          mountPath: /var/run/cdi
        - name: sys
          mountPath: /sys
          readOnly: true
      volumes:
      - name: plugins
        hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
      - name: plugins-registry
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: DirectoryOrCreate
      - name: cdi
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
      - name: sys
        hostPath:
          path: /sys
          type: Directory
